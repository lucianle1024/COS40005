name: Backend and connected checks

on:
  push:
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'data/scenarios/case_01/**'
      - '.github/workflows/connected-ci.yml'
  pull_request:
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'data/scenarios/case_01/**'
      - '.github/workflows/connected-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - working-directory: src/backend
        run: |
          python -m pip install -e '.[dev]' -c constraints.txt
          python -m pytest -q
      - working-directory: src/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise React against the SQLite-backed API
        env:
          SOC_SESSION_DATABASE: ${{ runner.temp }}/scrum90.sqlite3
        run: |
          (cd src/backend && exec python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          backend=$!
          (cd src/frontend && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort) &
          frontend=$!
          trap 'kill "$backend" "$frontend" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:8000/health http://127.0.0.1:5173/; do
            curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 "$url" > /dev/null
          done
          node src/frontend/scripts/check-connected.mjs
