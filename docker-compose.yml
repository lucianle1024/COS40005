services:
  backend:
    build:
      context: .
      target: backend
    environment:
      SOC_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      SOC_SESSION_DATABASE: /app/var/investigation-sessions.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
