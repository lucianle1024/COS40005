[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cos40005-backend"
version = "0.1.0"
description = "SOC research workbench backend scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]>=0.115,<1", "pydantic-settings>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
evaluation = ["google-genai>=1,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
